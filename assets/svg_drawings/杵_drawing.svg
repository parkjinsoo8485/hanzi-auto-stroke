<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- [세련된 포커스 기법 1: 후광 골드-오렌지 글로우 (Radial Spotlight Glow)] -->
    <radialGradient id="pestleSpotGlow" cx="490" cy="380" r="40%" fx="490" fy="380">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>

    <!-- 프리미엄 원목 절구공이 그라데이션 -->
    <linearGradient id="premiumWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C2410C"/>
      <stop offset="25%" stop-color="#F97316"/>
      <stop offset="60%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#7C2D12"/>
    </linearGradient>

    <!-- 절구공이 상단 하이라이트 -->
    <linearGradient id="woodHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>

    <!-- 묵직한 전통 화강암 돌절구 (뮤트 톤으로 배경 분리) -->
    <linearGradient id="stoneBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- 절구통 내부 웅덩이 -->
    <radialGradient id="mortarBowlHole" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="70%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#334155"/>
    </radialGradient>

    <!-- 쫄깃한 떡 반죽 -->
    <linearGradient id="riceGlaze" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FEF08A"/>
    </linearGradient>
  </defs>

  <!-- ========================================================= -->
  <!-- 0. [★ 세련된 포커스 1: 절구공이 뒤편 따뜻한 프리미엄 스포트라이트 후광] -->
  <!-- ========================================================= -->
  <circle cx="490" cy="380" r="320" fill="url(#pestleSpotGlow)"/>

  <!-- ========================================================= -->
  <!-- 1. [하단]: 묵직하고 정갈한 한국 전통 돌절구 (Mortar)             -->
  <!--    (절구공이가 돋보이도록 차분한 톤으로 완벽한 균형감 제공)          -->
  <!-- ========================================================= -->
  
  <!-- 돌절구 기단 받침대 -->
  <path d="M 330 830 L 690 830 L 730 890 L 290 890 Z" fill="#1E293B" stroke="#0F172A" stroke-width="8"/>

  <!-- 돌절구 외형 (안정적인 항아리/볼 형태) -->
  <path d="M 230 580 
           C 230 520, 790 520, 790 580 
           C 790 730, 680 840, 510 840 
           C 340 840, 230 730, 230 580 Z" 
        fill="url(#stoneBody)" 
        stroke="#0F172A" stroke-width="10" stroke-linejoin="round"/>

  <!-- 돌절구 윗면 림 (Rim) -->
  <ellipse cx="510" cy="580" rx="280" ry="60" fill="#475569" stroke="#0F172A" stroke-width="8"/>
  <!-- 절구통 안쪽 깊은 홈 -->
  <ellipse cx="510" cy="580" rx="235" ry="46" fill="url(#mortarBowlHole)"/>

  <!-- 절구 안에서 쿵덕쿵덕 찧어지는 하얀 찹쌀떡 반죽 -->
  <ellipse cx="510" cy="595" rx="150" ry="28" fill="url(#riceGlaze)"/>

  <!-- ========================================================= -->
  <!-- 2. [★ 주인공: 프리미엄 골든 아웃라인이 적용된 정통 절구공이]     -->
  <!--    (인위적인 빨간 원 대신 '선명한 골드 아웃라인 & 입체감'으로 강조)  -->
  <!-- ========================================================= -->
  
  <!-- 절구공이 본체 (양 끝 묵직한 볼륨 + 가운데 부드러운 손잡이 라인) -->
  <g id="pestlePremium">
    <!-- 절구공이 본체 -->
    <path d="M 430 110 
             C 460 95, 560 120, 580 160 
             C 590 200, 560 260, 540 330 
             C 525 390, 520 440, 535 500 
             L 565 620 
             C 555 655, 475 665, 440 640 
             L 420 520 
             C 435 460, 430 400, 415 340 
             C 395 270, 375 200, 390 150 
             C 400 120, 415 110, 430 110 Z" 
          fill="url(#premiumWood)" 
          stroke="#451A03" stroke-width="8" stroke-linejoin="round"/>

    <!-- [세련된 포커스 2: 절구공이 자체를 돋보이게 하는 좌측 골드 하이라이트 림선] -->
    <path d="M 410 160 
             C 400 220, 415 280, 430 350 
             C 440 400, 445 460, 430 520 
             L 445 635" 
          fill="none" stroke="#FDE047" stroke-width="6" stroke-linecap="round" opacity="0.85"/>

    <!-- 윗면 둥근 헤드 단면 -->
    <ellipse cx="485" cy="130" rx="65" ry="24" fill="#C2410C" stroke="#451A03" stroke-width="5" transform="rotate(-15 485 130)"/>
    <ellipse cx="485" cy="130" rx="45" ry="15" fill="url(#woodHighlight)" opacity="0.8" transform="rotate(-15 485 130)"/>

    <!-- 가운데 원목 손잡이 그립 결선 -->
    <path d="M 425 370 C 475 390, 520 380, 535 355" fill="none" stroke="#7C2D12" stroke-width="7" stroke-linecap="round"/>
    <path d="M 425 430 C 475 450, 520 440, 530 415" fill="none" stroke="#7C2D12" stroke-width="7" stroke-linecap="round"/>

    <!-- 아랫면 타격 단면 -->
    <ellipse cx="495" cy="635" rx="58" ry="20" fill="#451A03" transform="rotate(-8 495 635)"/>
  </g>

  <!-- ========================================================= -->
  <!-- 3. [생동감 있는 타격감: 경쾌한 방아 충격파 & 튀는 떡 방울]      -->
  <!-- ========================================================= -->
  <!-- 쿵! 내려찧을 때 터지는 산뜻한 방아 충격선 -->
  <path d="M 370 575 L 310 545" stroke="#F59E0B" stroke-width="6" stroke-linecap="round"/>
  <path d="M 380 620 L 330 645" stroke="#F59E0B" stroke-width="6" stroke-linecap="round"/>
  <path d="M 640 575 L 700 545" stroke="#F59E0B" stroke-width="6" stroke-linecap="round"/>
  <path d="M 630 620 L 680 645" stroke="#F59E0B" stroke-width="6" stroke-linecap="round"/>

  <!-- 공중으로 튀어오르는 쫄깃하고 투명한 찹쌀 방울들 -->
  <ellipse cx="360" cy="510" rx="14" ry="10" fill="#FFFFFF" stroke="#FEF08A" stroke-width="3" transform="rotate(-25 360 510)"/>
  <ellipse cx="650" cy="495" rx="13" ry="9" fill="#FFFFFF" stroke="#FEF08A" stroke-width="3" transform="rotate(20 650 495)"/>

  <!-- ========================================================= -->
  <!-- 4. [★ 세련된 포커스 3: 상단 은은한 골드 스파클 (Visual Sparkle)] -->
  <!--    인위적인 동그라미 테두리 대신 감각적인 빛 포인트로 시선 고정    -->
  <!-- ========================================================= -->
  <polygon points="485,45 493,62 510,70 493,78 485,95 477,78 460,70 477,62" fill="#FBBF24"/>
  <polygon points="565,115 570,125 580,130 570,135 565,145 560,135 550,130 560,125" fill="#FDE047"/>
</svg>