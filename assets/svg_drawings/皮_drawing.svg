<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- 고급 천연 호랑이/표범 모피 웜 골드 그라데이션 -->
    <linearGradient id="peltGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- 가죽 테두리/음영 -->
    <linearGradient id="peltShade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>

    <!-- 부드러운 하얀 배 부분 털 -->
    <linearGradient id="whiteBelly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>

    <!-- 바닥 부드러운 그림자 -->
    <radialGradient id="peltShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#94A3B8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 바닥 그림자 -->
  <ellipse cx="512" cy="530" rx="420" ry="380" fill="url(#peltShadow)"/>

  <!-- ========================================================= -->
  <!-- '가죽 피(皮)'의 직관성 1000% 대표 시각화:                     -->
  <!-- "바닥에 넓게 쫙 펼쳐진 맹수의 얼룩무늬 천연 동물 모피 카펫(Pelt)" -->
  <!-- ========================================================= -->

  <!-- 1. [동물 통가죽 메인 바디 (머리 + 양 앞다리 + 양 뒷다리 + 꼬리)] -->
  <path d="M 512 80 
           C 560 80, 590 130, 620 180 
           C 680 160, 780 180, 890 230 
           C 920 250, 930 290, 880 340 
           C 820 400, 740 420, 710 460 
           C 690 500, 730 570, 780 650 
           C 840 730, 910 810, 860 860 
           C 820 890, 750 870, 680 810 
           C 620 760, 580 750, 550 780 
           L 540 940 
           C 535 970, 489 970, 484 940 
           L 474 780 
           C 444 750, 404 760, 344 810 
           C 274 870, 204 890, 164 860 
           C 114 810, 184 730, 244 650 
           C 294 570, 334 500, 314 460 
           C 284 420, 204 400, 144 340 
           C 94 290, 104 250, 134 230 
           C 244 180, 344 160, 404 180 
           C 434 130, 464 80, 512 80 Z" 
        fill="url(#peltGold)" 
        stroke="#78350F" stroke-width="12" stroke-linejoin="round"/>

  <!-- 2. [가죽 안쪽 하얗고 부드러운 가슴/배 털 패치] -->
  <path d="M 512 180 
           C 560 220, 620 280, 620 380 
           C 620 490, 570 560, 580 660 
           C 550 700, 474 700, 444 660 
           C 454 560, 404 490, 404 380 
           C 404 280, 464 220, 512 180 Z" 
        fill="url(#whiteBelly)" 
        opacity="0.85"/>

  <!-- 3. [동물 머리 귀 부분 (펼쳐진 가죽 헤드 디테일)] -->
  <!-- 좌측 귀 -->
  <polygon points="430,150 390,70 470,120" fill="#78350F"/>
  <polygon points="430,140 405,85 460,120" fill="#FEF3C7"/>
  <!-- 우측 귀 -->
  <polygon points="594,150 634,70 554,120" fill="#78350F"/>
  <polygon points="594,140 619,85 564,120" fill="#FEF3C7"/>

  <!-- 4. [★ '동물의 가죽(피혁)'임을 0.1초 만에 알게 하는 맹수 가죽 호피/얼룩무늬 (Tiger/Leopard Stripes)] -->
  <!-- 중앙 척추 라인 줄무늬 -->
  <polygon points="512,220 480,240 544,240" fill="#451A03"/>
  <polygon points="512,320 470,345 554,345" fill="#451A03"/>
  <polygon points="512,420 460,450 564,450" fill="#451A03"/>
  <polygon points="512,530 470,560 554,560" fill="#451A03"/>
  <polygon points="512,640 480,665 544,665" fill="#451A03"/>

  <!-- 좌측 옆구리 줄무늬들 -->
  <path d="M 330 320 Q 400 340 460 330" stroke="#451A03" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M 310 420 Q 390 435 450 425" stroke="#451A03" stroke-width="14" stroke-linecap="round" fill="none"/>
  <path d="M 320 520 Q 400 535 460 525" stroke="#451A03" stroke-width="14" stroke-linecap="round" fill="none"/>
  <path d="M 340 620 Q 410 630 470 615" stroke="#451A03" stroke-width="12" stroke-linecap="round" fill="none"/>

  <!-- 우측 옆구리 줄무늬들 -->
  <path d="M 694 320 Q 624 340 564 330" stroke="#451A03" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M 714 420 Q 634 435 574 425" stroke="#451A03" stroke-width="14" stroke-linecap="round" fill="none"/>
  <path d="M 704 520 Q 624 535 564 525" stroke="#451A03" stroke-width="14" stroke-linecap="round" fill="none"/>
  <path d="M 684 620 Q 614 630 554 615" stroke="#451A03" stroke-width="12" stroke-linecap="round" fill="none"/>

  <!-- 앞발/뒷발 털 발톱 디테일 -->
  <!-- 좌측 앞발 -->
  <line x1="140" y1="260" x2="110" y2="280" stroke="#451A03" stroke-width="8" stroke-linecap="round"/>
  <line x1="150" y1="280" x2="120" y2="300" stroke="#451A03" stroke-width="8" stroke-linecap="round"/>
  <line x1="160" y1="300" x2="130" y2="320" stroke="#451A03" stroke-width="8" stroke-linecap="round"/>
  <!-- 우측 앞발 -->
  <line x1="884" y1="260" x2="914" y2="280" stroke="#451A03" stroke-width="8" stroke-linecap="round"/>
  <line x1="874" y1="280" x2="904" y2="300" stroke="#451A03" stroke-width="8" stroke-linecap="round"/>
  <line x1="864" y1="300" x2="894" y2="320" stroke="#451A03" stroke-width="8" stroke-linecap="round"/>

  <!-- 꼬리 줄무늬 -->
  <line x1="495" y1="830" x2="529" y2="830" stroke="#451A03" stroke-width="8" stroke-linecap="round"/>
  <line x1="493" y1="870" x2="531" y2="870" stroke="#451A03" stroke-width="8" stroke-linecap="round"/>
  <line x1="490" y1="910" x2="534" y2="910" stroke="#451A03" stroke-width="8" stroke-linecap="round"/>

  <!-- 가죽의 윤기 반짝임 -->
  <polygon points="512,30 519,45 534,50 519,55 512,70 505,55 490,50 505,45" fill="#F59E0B"/>
</svg>
