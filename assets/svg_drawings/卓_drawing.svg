  <polygon points="62,150 256,210 256,240 62,180" fill="#8D6E63" stroke="#4E342E" stroke-width="10"/>
  <polygon points="450,150 256,210 256,240 450,180" fill="#6D4C41" stroke="#4E342E" stroke-width="10"/>
