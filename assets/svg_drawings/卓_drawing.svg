  <rect x="80" y="180" width="36" height="270" rx="8" fill="#8D6E63" stroke="#4E342E" stroke-width="10"/>
  <rect x="396" y="180" width="36" height="270" rx="8" fill="#8D6E63" stroke="#4E342E" stroke-width="10"/>
