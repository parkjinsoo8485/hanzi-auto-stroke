<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="64" fill="#FFF8E1"/>
  <!-- 뒤쪽 두 다리 -->
  <rect x="120" y="200" width="30" height="230" fill="#6D4C41"/>
  <rect x="362" y="200" width="30" height="230" fill="#6D4C41"/>
  <!-- 탁자 두꺼운 상판 (원목) -->
