<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- 절벽 암석 텍스처 그라데이션 -->
    <linearGradient id="cliffRock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- 절벽 하이라이트 -->
    <linearGradient id="cliffHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <!-- 옹달샘 샘물 그라데이션 -->
    <linearGradient id="springWaterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="40%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- 흘러내리는 폭포/시냇물 그라데이션 -->
    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <!-- 물방울 빛 효과 -->
    <radialGradient id="bubbleGlow" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </radialGradient>
  </defs>

  <!-- ========================================== -->
  <!-- 1. [厂 기슭 엄] 거대한 바위산 절벽 실루엣       -->
  <!-- ========================================== -->
  <!-- 깎아지른 바위산 지붕과 좌측 절벽 기둥 -->
  <path d="M 180 140 
           L 860 140 
           C 890 140, 890 200, 860 200 
           L 320 200 
           C 300 320, 270 540, 240 700 
           C 210 830, 130 910, 80 920 
           C 60 920, 50 880, 70 850 
           C 130 760, 180 620, 210 440 
           C 230 330, 240 230, 245 200 
           L 180 200 
           C 150 200, 150 140, 180 140 Z" 
        fill="url(#cliffRock)"/>

  <!-- 절벽 입체 단면 바위 조각들 -->
  <polygon points="320,200 420,200 360,300 280,300" fill="url(#cliffHighlight)" opacity="0.6"/>
  <polygon points="280,300 360,300 310,460 250,440" fill="#334155" opacity="0.8"/>

  <!-- ========================================== -->
  <!-- 2. [泉 샘 천 상단 / 白] 절벽 아래 솟아나는 옹달샘   -->
  <!-- ========================================== -->
  <!-- 샘물을 감싸는 둥근 바위 웅덩이 테두리 -->
  <rect x="360" y="320" width="340" height="230" rx="40" 
        fill="#1E293B" stroke="#475569" stroke-width="16"/>

  <!-- 맑은 청정 옹달샘 수면 -->
  <rect x="380" y="340" width="300" height="190" rx="25" 
        fill="url(#springWaterGrad)"/>

  <!-- 지하에서 솟구쳐 나오는 샘물 수류 십자(十) 획선 -->
  <path d="M 530 230 L 530 340" stroke="#0284C7" stroke-width="26" stroke-linecap="round"/>
  <path d="M 380 435 L 680 435" stroke="#0284C7" stroke-width="20" stroke-linecap="round"/>

  <!-- 샘물에서 퐁퐁 솟아오르는 기포와 수면 파동 -->
  <circle cx="530" cy="390" r="26" fill="url(#bubbleGlow)"/>
  <circle cx="450" cy="400" r="16" fill="url(#bubbleGlow)"/>
  <circle cx="610" cy="400" r="16" fill="url(#bubbleGlow)"/>
  <ellipse cx="530" cy="480" rx="90" ry="16" fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.8"/>

  <!-- ========================================== -->
  <!-- 3. [小 / 水] 샘에서 뿜어져 흘러내리는 3갈래 물줄기 -->
  <!-- ========================================== -->
  <!-- 중앙 줄기 (아래로 굽이쳐 튀는 힘찬 폭포수 / 亅 형태) -->
  <path d="M 530 550 
           L 530 830 
           C 530 890, 480 910, 450 890 
           C 430 870, 450 830, 470 810 
           C 485 790, 485 730, 485 550 Z" 
        fill="url(#streamGrad)"/>

  <!-- 좌측 튀는 시냇물 줄기 (삐침 丿 형태) -->
  <path d="M 420 640 Q 350 730 280 820" 
        fill="none" stroke="#38BDF8" stroke-width="30" stroke-linecap="round"/>

  <!-- 우측 굽이치는 시냇물 줄기 (파임 ㇏ 형태) -->
  <path d="M 640 640 Q 730 730 840 820" 
        fill="none" stroke="#38BDF8" stroke-width="30" stroke-linecap="round"/>

  <!-- 물줄기 주변 튀는 맑은 물방울들 -->
  <circle cx="320" cy="850" r="14" fill="#0284C7"/>
  <circle cx="260" cy="830" r="10" fill="#38BDF8"/>
  <circle cx="510" cy="870" r="15" fill="#0284C7"/>
  <circle cx="810" cy="850" r="14" fill="#0284C7"/>
  <circle cx="870" cy="830" r="10" fill="#38BDF8"/>
</svg>