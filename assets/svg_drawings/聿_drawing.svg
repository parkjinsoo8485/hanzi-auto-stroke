  <path d="M140 240 Q256 220 280 240" fill="none" stroke="#FFB74D" stroke-width="28" stroke-linecap="round"/>
  <path d="M150 300 Q256 280 270 300" fill="none" stroke="#FFB74D" stroke-width="28" stroke-linecap="round"/>
  <!-- 붓 촉(모필)과 먹물 한 점 -->
