<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="brushHandle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B4513"/>
      <stop offset="50%" stop-color="#D2691E"/>
      <stop offset="100%" stop-color="#5C2E0B"/>
    </linearGradient>
    <linearGradient id="brushFerrule" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#FFA500"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="brushBristles" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2B2B2B"/>
      <stop offset="60%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  
  <!-- 붓대 (대나무 손잡이) - 45도 각도 -->
  <path d="M 280 80 L 460 260 L 440 280 L 260 100 Z" fill="url(#brushHandle)" stroke="#3E1C00" stroke-width="4"/>
  <circle cx="450" cy="270" r="12" fill="#5C2E0B"/>
  
  <!-- 금속 이음새 (Ferrule) -->
  <path d="M 260 100 L 280 80 L 240 40 L 220 60 Z" fill="url(#brushFerrule)" stroke="#8B6914" stroke-width="3"/>
  <rect x="235" y="55" width="30" height="8" transform="rotate(-45 250 59)" fill="#FFE4B5"/>
  
  <!-- 붓털 (촉 - 날렵하고 부드러운 먹물 붓촉) -->
  <!-- 붓 끝점이 (40, 472) 즉 좌측 하단에 위치하여 글씨를 쓰는 정밀 팁 역할 -->
  <path d="M 220 60 C 180 100, 120 200, 70 340 C 50 390, 40 440, 30 480 C 70 470, 120 460, 170 440 C 310 390, 410 330, 450 290 Z" fill="url(#brushBristles)" opacity="0.95"/>
  
  <!-- 먹물/골드 잉크 팁 하이라이트 -->
  <circle cx="35" cy="475" r="14" fill="#FDE047" stroke="#F59E0B" stroke-width="4"/>
  <circle cx="35" cy="475" r="6" fill="#FFFFFF"/>
</svg>